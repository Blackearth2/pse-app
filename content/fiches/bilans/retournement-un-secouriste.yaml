id: retournement-un-secouriste
niveau: PSE1
chapitre: bilans
type: technique
ordre: 9
titre: Retournement à un secouriste
motsCles: [retournement, victime sur le ventre, secouriste isolé, axe tête-cou-tronc, nuque]
statut: verifie
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 04FT02, 12-2023)
  code: 04FT02
  page: 75
liees: [retournement-deux-secouristes, deuxieme-regard, lva-victime-non-traumatisee]
blocs:
  - type: texte
    titre: Indication
    contenu: "Technique indiquée après avoir trouvé une victime sur le ventre sans suspicion de traumatisme, ou lorsque le secouriste est isolé. Aucun matériel n'est nécessaire."
  - type: liste
    titre: Justification
    items:
      - Libérer les voies aériennes et rechercher les signes de respiration.
      - Réaliser les gestes d'urgence (ventilation artificielle, compressions thoraciques).
      - Examiner la victime.
  - type: etapes
    titre: Réalisation
    items:
      - "Le retournement s'effectue du côté opposé au visage de la victime."
      - "Placer le bras de la victime du côté du retournement au-dessus de sa tête (cela facilite le retournement et maintient la tête dans l'axe)."
      - "Se placer dans une position stable (à genoux ou en trépied) du côté du retournement, à distance suffisante pour ne pas gêner le retournement complet."
      - "Saisir la victime par l'épaule et par la hanche du côté opposé au retournement."
      - "Faire rouler doucement et d'un seul bloc la victime jusqu'à ce qu'elle soit sur le côté."
      - "Glisser la main qui était à l'épaule au niveau de la nuque pour la maintenir, l'avant-bras reposant contre le dos de la victime."
      - "Tirer sur la hanche pour terminer le retournement ; la main à la nuque accompagne le mouvement, puis est retirée avec précaution."
      - "Une fois la victime sur le dos, rechercher les signes de respiration et débuter si besoin les manœuvres de réanimation."
  - type: attention
    titre: Risques et contraintes
    items:
      - Pour limiter le risque d'aggravation d'un traumatisme de la colonne cervicale, il est préférable de retourner la victime à deux sauveteurs au moins.
  - type: liste
    titre: Critère d'évaluation
    items:
      - L'axe tête-cou-tronc est maintenu le plus rectiligne possible tout au long du retournement.
qcm:
  - id: q1
    enonce: "Le retournement à un seul secouriste est indiqué :"
    propositions:
      - Systématiquement en équipe avec suspicion de traumatisme du rachis
      - Sans suspicion de traumatisme, ou lorsque le secouriste est isolé
      - Uniquement chez l'enfant
    bonnes:
      - 1
    explication: "Indiqué pour une victime sur le ventre sans suspicion de traumatisme ou si le secouriste est isolé."
  - id: q2
    enonce: "Avant de faire rouler la victime, où place-t-on son bras du côté du retournement ?"
    propositions:
      - Le long du corps
      - Sous la cuisse
      - Au-dessus de sa tête
      - Croisé sur la poitrine
    bonnes:
      - 2
    explication: "Le bras est placé au-dessus de la tête pour faciliter le retournement et maintenir la tête dans l'axe."
  - id: q3
    enonce: "Que fait la main qui tenait l'épaule une fois la victime sur le côté ?"
    propositions:
      - Elle est glissée au niveau de la nuque pour la maintenir
      - Elle recherche le pouls radial
      - Elle relève le menton
      - Elle est retirée définitivement
    bonnes:
      - 0
    explication: "Elle maintient la nuque, l'avant-bras contre le dos, pendant que l'autre main tire sur la hanche pour terminer le retournement."
  - id: q4
    enonce: "Quelles affirmations sont exactes ?"
    propositions:
      - Le retournement se fait du côté opposé au visage
      - Le roulement se fait d'un seul bloc
      - La victime est saisie par le bras et la cheville
      - Le retournement à deux sauveteurs au moins est préférable pour limiter le risque cervical
    bonnes:
      - 0
      - 1
      - 3
    explication: "La victime est saisie par l'épaule et la hanche, pas par le bras et la cheville."
