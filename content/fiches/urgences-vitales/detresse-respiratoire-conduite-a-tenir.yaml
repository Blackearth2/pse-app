id: detresse-respiratoire-conduite-a-tenir
niveau: PSE1
chapitre: urgences-vitales
type: procedure
ordre: 33
titre: "Détresse respiratoire (conduite à tenir)"
motsCles: [détresse respiratoire, position demi-assise, oxygène, SpO2, urgence vitale]
statut: verifie
source:
  document: "Référentiels techniques nationaux PSE — juillet 2026 (fiche 05PR08, 07-2026)"
  code: 05PR08
  page: 167
liees: [detresse-respiratoire-connaissances, administration-oxygene-inhalation, mesure-saturation-pulsee-oxygene, positions-attente-transport]
blocs:
  - type: texte
    titre: En bref
    contenu: "Face à une urgence vitale ou en cas d'aggravation, appliquer la conduite à tenir adaptée et réaliser en priorité les gestes d'urgence qui s'imposent. Les étapes ci-dessous concernent la victime consciente, après avoir traité une urgence vitale s'il y en avait une."
  - type: etapes
    titre: La victime est consciente
    items:
      - "Laisser la victime s'installer dans la position qui lui est la plus confortable ; lui proposer la position demi-assise ou assise."
      - "Desserrer tous les vêtements qui peuvent gêner la respiration."
      - "Administrer de l'oxygène en inhalation : adapter l'administration à la valeur de la SpO2 ; en l'absence de valeur de SpO2, poursuivre l'administration jusqu'à obtenir un avis médical."
      - "Protéger la victime contre le froid, la chaleur ou les intempéries."
      - "Poursuivre le bilan et surveiller attentivement la ventilation."
  - type: attention
    titre: Points de vigilance
    items:
      - "La position assise ou demi-assise libère les mouvements du diaphragme et améliore la respiration."
qcm:
  - id: q1
    enonce: "Quelle position proposer à une victime consciente en détresse respiratoire ?"
    propositions:
      - "Allongée à plat dos"
      - "Demi-assise ou assise, dans la position qui lui est la plus confortable"
      - "Position latérale de sécurité systématiquement"
    bonnes:
      - 1
    explication: "On laisse la victime s'installer dans la position la plus confortable et on lui propose la position demi-assise ou assise."
  - id: q2
    enonce: "Pourquoi la position assise ou demi-assise est-elle proposée ?"
    propositions:
      - "Elle libère les mouvements du diaphragme et améliore la respiration"
      - "Elle évite le refroidissement"
      - "Elle facilite la mesure de la glycémie"
    bonnes:
      - 0
    explication: "La position assise ou demi-assise libère les mouvements du diaphragme et améliore la respiration."
  - id: q3
    enonce: "Comment administre-t-on l'oxygène ?"
    propositions:
      - "Toujours au même débit, sans tenir compte de la SpO2"
      - "En l'adaptant à la valeur de la SpO2"
      - "Sans SpO2, en poursuivant l'administration jusqu'à obtenir un avis médical"
    bonnes:
      - 1
      - 2
    explication: "L'administration est adaptée à la valeur de la SpO2 ; en l'absence de valeur, on la poursuit jusqu'à obtenir un avis médical."
  - id: q4
    enonce: "Quels gestes font partie de la conduite à tenir devant une victime consciente en détresse respiratoire ?"
    propositions:
      - "Desserrer les vêtements qui peuvent gêner la respiration"
      - "Protéger contre le froid, la chaleur ou les intempéries"
      - "Poursuivre le bilan et surveiller attentivement la ventilation"
      - "Faire boire la victime"
    bonnes:
      - 0
      - 1
      - 2
    explication: "La conduite à tenir comprend le desserrage des vêtements, la protection de la victime, la poursuite du bilan et la surveillance attentive de la ventilation."
  - id: q5
    enonce: "Que faut-il faire en priorité face à une urgence vitale ou en cas d'aggravation ?"
    propositions:
      - "Poursuivre le bilan sans intervenir"
      - "Appliquer la conduite à tenir adaptée et réaliser en priorité les gestes d'urgence qui s'imposent"
      - "Attendre l'avis médical"
    bonnes:
      - 1
    explication: "Face à une urgence vitale ou en cas d'aggravation, on réalise en priorité les gestes d'urgence qui s'imposent."
