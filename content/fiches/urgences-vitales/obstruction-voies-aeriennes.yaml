# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: obstruction-voies-aeriennes
niveau: PSE1
chapitre: urgences-vitales
type: procedure
ordre: 2
titre: Obstruction des voies aériennes
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
liees:
  - arret-cardiaque-adulte
blocs:
  - type: texte
    titre: En bref
    contenu: "L'obstruction brutale des voies aériennes par un corps étranger empêche l'air de passer. Les RTN 2026 retiennent une approche binaire : obstruction totale ou non."
  - type: chiffres
    titre: À retenir
    items:
      - valeur: "5"
        libelle: Claques dans le dos
      - valeur: "5"
        libelle: Compressions
      - valeur: Tête plus basse
        libelle: Nourrisson
      - valeur: RCP
        libelle: Perte de connaissance
  - type: etapes
    titre: Conduite à tenir
    items:
      - "Critère : la victime ne peut plus parler ni tousser (obstruction totale)."
      - Donner jusqu'à 5 claques vigoureuses dans le dos, entre les omoplates.
      - En cas d'échec, jusqu'à 5 compressions abdominales (adulte, enfant) ou thoraciques (nourrisson, personne obèse, femme enceinte).
      - "Alterner claques et compressions jusqu'à la désobstruction ou la perte de connaissance ; si la victime perd connaissance : RCP."
      - "Si la victime peut parler ou tousser : l'installer dans la position où elle se sent le mieux, l'encourager à tousser, ne pas faire de claques ni de compressions, demander un avis médical."
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - "La fiche « obstruction partielle » disparaît : l'obstruction est totale ou non."
      - "Les claques sont déclenchées sur des critères fonctionnels : victime incapable de parler ou de tousser."
      - Le nourrisson est désobstrué la tête plus basse que le corps.
qcm:
  - id: q1
    enonce: Un adulte porte les mains à sa gorge, ne peut ni parler ni tousser. Premier geste ?
    propositions:
      - L'encourager à tousser
      - Jusqu'à 5 claques dans le dos
      - Lui donner de l'eau
      - Le mettre en PLS
    bonnes:
      - 1
    explication: "L'incapacité à parler ou tousser signe une obstruction totale : claques dans le dos, puis compressions si échec."
    nouveaute: true
  - id: q2
    enonce: Après une fausse route, la victime tousse fort et parle. Que faire ?
    propositions:
      - Claques dans le dos
      - Compressions abdominales
      - L'installer confortablement, l'encourager à tousser, surveiller
      - Débuter la RCP
    bonnes:
      - 2
    explication: "L'obstruction n'est pas totale : pas de claques ni de compressions, on encourage la toux et on demande un avis médical."
    nouveaute: true
  - id: q3
    enonce: Comment place-t-on un nourrisson pour la désobstruction ?
    propositions:
      - Tête plus basse que le corps
      - Tête plus haute que le corps
      - Assis
      - Sur le dos à plat
    bonnes:
      - 0
    explication: "Précision des RTN 2026 : le nourrisson est désobstrué la tête plus basse que le corps."
    nouveaute: true
  - id: q4
    enonce: La victime d'une obstruction totale perd connaissance. Que faire ?
    propositions:
      - Continuer les claques
      - Débuter la RCP
      - La mettre en PLS
      - Attendre les secours
    bonnes:
      - 1
    explication: "Perte de connaissance : on l'allonge et on débute la réanimation cardio-pulmonaire."
  - id: q5
    enonce: "Chez une femme enceinte, en cas d'échec des claques, on réalise :"
    propositions:
      - Des compressions abdominales
      - Des compressions thoraciques
      - Rien d'autre
      - Des insufflations
    bonnes:
      - 1
    explication: "Femme enceinte, personne obèse et nourrisson : compressions thoraciques."
  - id: q6
    enonce: "Obstruction totale, claques inefficaces : chez quelles victimes réalise-t-on des compressions thoraciques plutôt qu’abdominales ?"
    propositions:
      - Le nourrisson
      - La personne obèse
      - La femme enceinte
      - L’adulte de corpulence normale
    bonnes:
      - 0
      - 1
      - 2
    explication: Compressions thoraciques chez le nourrisson, la personne obèse et la femme enceinte ; abdominales chez l’adulte et l’enfant.
