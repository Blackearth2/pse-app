# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: arret-cardiaque-enfant-nourrisson
niveau: PSE1
chapitre: urgences-vitales
type: procedure
ordre: 5
titre: Arrêt cardiaque de l'enfant et du nourrisson
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
liees:
  - arret-cardiaque-adulte
  - ventilation-oxygenotherapie
blocs:
  - type: texte
    titre: En bref
    contenu: Chez l'enfant et le nourrisson, l'arrêt cardiaque est le plus souvent d'origine respiratoire. Les RTN 2026 simplifient et harmonisent la séquence.
  - type: chiffres
    titre: À retenir
    items:
      - valeur: "15 : 2"
        libelle: Ratio enfant / nourrisson
      - valeur: Supprimées
        libelle: Insufflations initiales
      - valeur: Thorax / dos
        libelle: Électrodes (< 25 kg)
      - valeur: 2 pouces superposés
        libelle: Nourrisson (à deux)
  - type: etapes
    titre: Conduite à tenir
    items:
      - "Constater l'arrêt : pas de réponse, pas de respiration normale."
      - Débuter la RCP sans les 5 insufflations initiales (y compris en cas de noyade).
      - Réaliser des cycles de 15 compressions et 2 insufflations (dépression d'environ 1/3 de l'épaisseur du thorax).
      - Chez le nourrisson, compressions avec deux pouces placés l'un sur l'autre.
      - "DAE : victime de moins de 25 kg, électrodes en position thorax/dos (antéro-postérieure)."
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - Suppression des 5 insufflations initiales chez l'enfant et le nourrisson, même en cas de noyade.
      - "Nourrisson : deux pouces placés l'un sur l'autre, et non plus côte à côte."
      - "Seuil de 25 kg pour la position des électrodes : thorax/dos en dessous."
qcm:
  - id: q1
    enonce: Victime de 20 kg en arrêt cardiaque. Position des électrodes ?
    propositions:
      - Antéro-latérale
      - Thorax / dos
      - Une seule électrode
      - DAE contre-indiqué
    bonnes:
      - 1
    explication: "Nouveau seuil de 25 kg : en dessous, les électrodes sont placées thorax/dos."
    nouveaute: true
  - id: q2
    enonce: "Enfant en arrêt cardiaque après noyade. Selon les RTN 2026 :"
    propositions:
      - 5 insufflations initiales
      - RCP sans les 5 insufflations initiales
      - 2 minutes de compressions seules puis alerte
      - 10 insufflations initiales
    bonnes:
      - 1
    explication: Les 5 insufflations initiales sont supprimées chez l'enfant et le nourrisson, même en cas de noyade.
    nouveaute: true
  - id: q3
    enonce: "Compressions chez le nourrisson (technique à deux pouces) :"
    propositions:
      - Pouces côte à côte
      - Pouces l'un sur l'autre
      - Deux doigts
      - Talon de la main
    bonnes:
      - 1
    explication: Les deux pouces sont désormais placés l'un sur l'autre.
    nouveaute: true
  - id: q4
    enonce: "Ratio de RCP chez l'enfant et le nourrisson (PSE) :"
    propositions:
      - "30 : 2"
      - "15 : 2"
      - "5 : 1"
      - "3 : 1"
    bonnes:
      - 1
    explication: 15 compressions pour 2 insufflations.
