# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: perte-de-connaissance
niveau: PSE1
chapitre: urgences-vitales
type: procedure
ordre: 3
titre: Perte de connaissance
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
liees:
  - arret-cardiaque-adulte
blocs:
  - type: texte
    titre: En bref
    contenu: Une victime qui ne répond pas et ne réagit pas mais respire normalement risque l'obstruction de ses voies aériennes (chute de la langue, vomissements).
  - type: chiffres
    titre: À retenir
    items:
      - valeur: 10 s max
        libelle: Contrôle de la respiration
      - valeur: PLS
        libelle: Position
      - valeur: PLS à 2 ou plus
        libelle: Victime traumatisée
      - valeur: Continue
        libelle: Surveillance
  - type: etapes
    titre: Conduite à tenir
    items:
      - "Apprécier la conscience : poser des questions simples, demander de serrer la main."
      - "Libérer les voies aériennes : bascule de la tête en arrière, élévation du menton (ou subluxation si traumatisme)."
      - Apprécier la respiration pendant 10 secondes au plus.
      - "Si elle respire : mettre en position latérale de sécurité, alerter, surveiller la respiration."
      - "Si elle ne respire pas ou respire anormalement (gasps) : arrêt cardiaque, débuter la RCP."
qcm:
  - id: q1
    enonce: "Victime inconsciente, respiration normale, pas de traumatisme :"
    propositions:
      - Position latérale de sécurité
      - RCP
      - Position demi-assise
      - Jambes surélevées
    bonnes:
      - 0
    explication: La PLS protège les voies aériennes ; on surveille ensuite la respiration en continu.
  - id: q2
    enonce: "Durée maximale pour apprécier la respiration :"
    propositions:
      - 3 secondes
      - 10 secondes
      - 30 secondes
      - 1 minute
    bonnes:
      - 1
    explication: 10 secondes au plus, voies aériennes libérées.
