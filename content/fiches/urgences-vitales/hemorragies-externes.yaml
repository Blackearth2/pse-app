# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: hemorragies-externes
niveau: PSE1
chapitre: urgences-vitales
type: procedure
ordre: 1
titre: Hémorragies externes et garrot
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
blocs:
  - type: texte
    titre: En bref
    contenu: "Une hémorragie externe est un saignement abondant et prolongé qui ne s'arrête pas spontanément. Elle menace la vie en quelques minutes : l'arrêter est la priorité absolue."
  - type: chiffres
    titre: À retenir
    items:
      - valeur: Compression directe
        libelle: 1er geste
      - valeur: À noter
        libelle: Heure de pose du garrot
      - valeur: Jamais
        libelle: Garrot retiré par le secouriste
      - valeur: Packing
        libelle: Plaie cavitaire profonde
  - type: etapes
    titre: Conduite à tenir
    items:
      - Comprimer immédiatement l'endroit qui saigne (main gantée, pansement).
      - Relayer par un pansement compressif si la compression est efficace.
      - Poser un garrot sur un membre si la compression est inefficace ou impossible (plusieurs victimes, plaie inaccessible…), entre la plaie et la racine du membre, jamais sur une articulation.
      - "Pour une plaie profonde où la compression ou le garrot ne sont pas réalisables : packing, puis compression."
      - Allonger la victime, la protéger du froid, alerter et surveiller.
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - "Introduction du packing : remplir de compresses une plaie cavitaire profonde avant de comprimer."
      - Les garrots pneumatiques sont reconnus aux côtés des garrots à barre de serrage ; préférence pour les modèles de fabrication industrielle.
      - Les garrots élastiques de prélèvement sanguin sont exclus.
qcm:
  - id: q1
    enonce: Plaie profonde au pli de l'aine qui saigne abondamment, garrot impossible. Que faire ?
    propositions:
      - Packing de la plaie puis compression
      - Garrot sous le genou
      - Surélever la jambe et attendre
      - PLS
    bonnes:
      - 0
    explication: "Nouveauté 2026 : le packing consiste à remplir la plaie cavitaire de compresses avant de comprimer."
    nouveaute: true
  - id: q2
    enonce: Lequel de ces dispositifs est exclu comme garrot ?
    propositions:
      - Garrot à barre de serrage industriel
      - Garrot pneumatique
      - Garrot élastique de prélèvement sanguin
      - Garrot industriel de dotation
    bonnes:
      - 2
    explication: Les garrots élastiques de prélèvement sont exclus ; les garrots pneumatiques sont reconnus, avec une préférence pour la fabrication industrielle.
    nouveaute: true
  - id: q3
    enonce: "Une fois le garrot posé :"
    propositions:
      - On le desserre toutes les 20 minutes
      - On note l'heure de pose et on ne le retire jamais
      - On le recouvre pour ne pas impressionner
      - On le retire dès que ça ne saigne plus
    bonnes:
      - 1
    explication: L'heure de pose est notée et transmise ; seul un médecin décide du retrait.
  - id: q4
    enonce: "Premier geste face à une hémorragie externe accessible :"
    propositions:
      - Garrot d'emblée
      - Compression directe
      - Point de compression à distance
      - Allonger jambes surélevées
    bonnes:
      - 1
    explication: La compression directe de la plaie est le premier geste ; le garrot intervient si elle est inefficace ou impossible.
