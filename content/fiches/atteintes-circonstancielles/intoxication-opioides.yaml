# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: intoxication-opioides
niveau: PSE1
chapitre: atteintes-circonstancielles
type: procedure
ordre: 1
titre: Intoxication aux opioïdes
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
liees:
  - ventilation-oxygenotherapie
blocs:
  - type: texte
    titre: En bref
    contenu: "Les opioïdes (héroïne, morphiniques, certains médicaments) dépriment la respiration. Signes évocateurs : somnolence ou inconscience, respiration lente, pupilles très serrées."
  - type: chiffres
    titre: À retenir
    items:
      - valeur: FR ≤ 6 /min
        libelle: Ventilation artificielle
      - valeur: Après le début de la réa
        libelle: Naloxone
      - valeur: Serrées (myosis)
        libelle: Pupilles
      - valeur: Arrêt respiratoire
        libelle: Risque
  - type: etapes
    titre: Conduite à tenir
    items:
      - Assurer la sécurité (seringues, aiguilles).
      - Apprécier la conscience et la respiration ; compter la fréquence respiratoire.
      - "Si la respiration est très lente (6/min ou moins) : ventilation artificielle au BAVU avec oxygène."
      - Administrer la naloxone, si disponible et autorisé, après avoir débuté la réanimation.
      - "Alerter, surveiller : l'effet de la naloxone peut être plus court que celui de l'opioïde."
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - Ventilation artificielle à partir d'une fréquence respiratoire de 6/min.
      - La naloxone est administrée après le début de la réanimation.
qcm:
  - id: q1
    enonce: "Intoxication aux opioïdes : à partir de quelle FR débute-t-on la ventilation artificielle ?"
    propositions:
      - 6 /min ou moins
      - Moins de 12 /min
      - Moins de 20 /min
      - Uniquement en arrêt cardiaque
    bonnes:
      - 0
    explication: "RTN 2026 : ventilation artificielle dès une fréquence de 6/min."
    nouveaute: true
  - id: q2
    enonce: "La naloxone est administrée :"
    propositions:
      - Avant tout geste
      - Après le début de la réanimation
      - Jamais par un secouriste
      - Seulement si la victime est consciente
    bonnes:
      - 1
    explication: La naloxone est administrée après avoir débuté la réanimation.
    nouveaute: true
