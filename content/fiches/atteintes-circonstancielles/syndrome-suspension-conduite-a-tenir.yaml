id: syndrome-suspension-conduite-a-tenir
niveau: PSE2
chapitre: atteintes-circonstancielles
type: procedure
ordre: 25
titre: Syndrome de suspension (conduite à tenir)
motsCles: [syndrome de suspension, dégagement, membres inférieurs, position horizontale, harnais, hypothermie]
statut: verifie
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 08PR12, 12-2023)
  code: 08PR12
  page: 311
liees: [syndrome-suspension-connaissances, perte-de-connaissance-equipe, arret-cardiaque, administration-oxygene-inhalation, hypothermie-conduite-a-tenir]
blocs:
  - type: texte
    titre: Dégager la victime suspendue
    contenu: "Dans toutes les situations, le dégagement de la victime doit être le plus rapide possible et se faire en toutes conditions de sécurité. Il nécessite le plus souvent l'intervention d'équipes spécialisées. En attendant le dégagement, essayer de maintenir les membres inférieurs de la victime en position horizontale ; si elle est coopérante et le peut, lui demander de le faire elle-même."
  - type: etapes
    titre: Victime décrochée ayant perdu connaissance
    items:
      - "Allonger la victime au sol."
      - "Appliquer immédiatement, en fonction de la présence ou non d'une respiration efficace, la conduite à tenir devant une victime qui a perdu connaissance : soit qui respire, soit qui ne respire pas ou présente une respiration agonique (gasps)."
  - type: etapes
    titre: Victime décrochée consciente
    items:
      - "Installer la victime en position allongée horizontale."
      - "Desserrer le harnais (il pourra ensuite être retiré si nécessaire avant l'évacuation)."
      - "Prendre en charge les lésions associées, particulièrement si la victime a présenté une chute ou une électrisation."
      - "Administrer de l'oxygène en complément si nécessaire."
      - "Lutter contre une hypothermie."
      - "Demander un avis médical et suivre les consignes du médecin."
      - "Surveiller les fonctions vitales de la victime à intervalles réguliers."
  - type: attention
    titre: Points de vigilance
    items:
      - "Le dégagement doit être le plus rapide possible mais toujours en toutes conditions de sécurité ; il nécessite le plus souvent des équipes spécialisées."
      - "En attendant le dégagement, maintenir les membres inférieurs en position horizontale."
      - "Victime décrochée consciente : la position est allongée horizontale et le harnais est desserré (non retiré d'emblée)."
      - "L'aggravation peut être rapide et brutale après le dégagement : surveillance régulière des fonctions vitales."
qcm:
  - id: q1
    enonce: "Que faire en attendant le dégagement d'une victime suspendue ?"
    propositions:
      - Essayer de maintenir ses membres inférieurs en position horizontale
      - Lui demander de rester parfaitement immobile, jambes pendantes
      - Couper immédiatement la corde
    bonnes:
      - 0
    explication: "En attendant le dégagement, on essaie de maintenir les membres inférieurs en position horizontale ; la victime coopérante peut le faire elle-même."
  - id: q2
    enonce: "Comment doit se faire le dégagement d'une victime suspendue ?"
    propositions:
      - Le plus rapidement possible et en toutes conditions de sécurité
      - Lentement pour éviter tout risque
      - Sans équipe spécialisée dans tous les cas
    bonnes:
      - 0
    explication: "Le dégagement doit être le plus rapide possible et se faire en toutes conditions de sécurité ; il nécessite le plus souvent des équipes spécialisées."
  - id: q3
    enonce: "Une victime décrochée est consciente. Quelles actions sont indiquées ?"
    propositions:
      - L'installer en position allongée horizontale
      - Desserrer le harnais
      - Lutter contre une hypothermie
      - La mettre debout pour évaluer sa marche
    bonnes:
      - 0
      - 1
      - 2
    explication: "On installe la victime allongée horizontale, on desserre le harnais, on prend en charge les lésions, on lutte contre l'hypothermie, on demande un avis médical et on surveille les fonctions vitales à intervalles réguliers."
  - id: q4
    enonce: "Une victime décrochée a perdu connaissance. Que fait-on en premier ?"
    propositions:
      - L'allonger au sol puis appliquer la conduite à tenir devant une victime inconsciente selon sa respiration
      - Desserrer le harnais et attendre
      - Lui donner à boire
    bonnes:
      - 0
    explication: "On allonge la victime au sol et on applique immédiatement la conduite à tenir devant une victime qui a perdu connaissance, selon la présence ou non d'une respiration efficace."
  - id: q5
    enonce: "Que devient le harnais chez une victime décrochée et consciente ?"
    propositions:
      - Il est desserré, puis pourra être retiré si nécessaire avant l'évacuation
      - Il est coupé immédiatement dans tous les cas
      - Il est serré davantage
    bonnes:
      - 0
    explication: "Le harnais est desserré ; il pourra ensuite être retiré si nécessaire avant l'évacuation de la victime."
