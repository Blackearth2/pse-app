# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: brulures
niveau: PSE1
chapitre: atteintes-circonstancielles
type: procedure
ordre: 3
titre: Brûlures
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
blocs:
  - type: texte
    titre: En bref
    contenu: La gravité dépend de la surface, de la profondeur, de la localisation et de la victime. Le refroidissement précoce limite l'extension de la brûlure.
  - type: chiffres
    titre: À retenir
    items:
      - valeur: Eau tempérée
        libelle: Refroidissement
      - valeur: Supprimé
        libelle: Film alimentaire
      - valeur: Ne pas percer
        libelle: Cloques
      - valeur: Alerter le 15
        libelle: Brûlure grave
  - type: etapes
    titre: Conduite à tenir
    items:
      - Supprimer la cause, éteindre les flammes si besoin.
      - Refroidir le plus tôt possible à l'eau tempérée, sans retarder la prise en charge des détresses.
      - Retirer les vêtements non adhérents et les bijoux.
      - Évaluer la gravité (étendue, aspect, localisation), alerter.
      - Protéger la brûlure selon les moyens et consignes, prévenir l'hypothermie.
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - L'usage du film alimentaire pour protéger la brûlure est supprimé.
qcm:
  - id: q1
    enonce: Quelle pratique a été supprimée pour les brûlures ?
    propositions:
      - Refroidir à l'eau tempérée
      - Couvrir de film alimentaire
      - Retirer les bijoux
      - Alerter en cas de brûlure grave
    bonnes:
      - 1
    explication: Le film alimentaire n'est plus utilisé dans les RTN 2026.
    nouveaute: true
  - id: q2
    enonce: "Face à une cloque (phlyctène) :"
    propositions:
      - La percer
      - La laisser intacte
      - L'arracher
      - La recouvrir de pommade
    bonnes:
      - 1
    explication: "On ne perce pas les cloques : risque infectieux."
