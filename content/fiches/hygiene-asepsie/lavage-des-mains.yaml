id: lavage-des-mains
niveau: PSE1
chapitre: hygiene-asepsie
type: technique
ordre: 6
titre: Lavage des mains
motsCles: [lavage des mains, savon, 30 secondes, essuie-mains, flore transitoire, robinet]
statut: brouillon
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 03FT02, 09-2014)
  code: 03FT02
  page: 50
liees:
  - friction-des-mains
  - retrait-des-gants
blocs:
  - type: texte
    titre: En bref
    contenu: "Le lavage simple des mains élimine les souillures, réduit la flore transitoire (bactéries, virus, champignons) et diminue le risque de transmission de maladies."
  - type: chiffres
    titre: À retenir en chiffres
    items:
      - valeur: 30 secondes
        libelle: Durée du savonnage
  - type: liste
    titre: Quand se laver les mains
    items:
      - "En début et fin de journée, à la prise et à la sortie du service."
      - "Systématiquement avant un soin et entre deux victimes."
      - "Avant ou après un geste de la vie courante (après s'être mouché, avant de manger, après être allé aux toilettes)."
      - "Au retrait des gants."
      - "En présence de poudre sur les mains."
      - "Chaque fois que les mains sont visiblement souillées."
  - type: liste
    titre: Matériel
    items:
      - "Eau du robinet, à défaut eau en bouteille."
      - "Savon neutre liquide."
      - "Poubelle à pédale ou sans couvercle, équipée d'un sac jetable."
      - "Distributeur d'essuie-mains à usage unique (papier ou non-tissé)."
  - type: etapes
    titre: Réalisation
    items:
      - "Mouiller les mains."
      - "Prendre une dose de savon liquide."
      - "Savonner pendant 30 secondes en insistant sur la pulpe des doigts, les espaces interdigitaux, le pourtour des ongles, les bords externes des mains, mais aussi le dos des mains, les paumes et les poignets."
      - "Rincer abondamment sous l'eau, sans toucher le robinet."
      - "Sécher par tamponnement avec des essuie-mains à usage unique."
      - "Utiliser le dernier essuie-mains pour fermer le robinet."
      - "Jeter l'essuie-mains dans une poubelle sans la toucher avec les mains."
  - type: texte
    titre: Critères d'évaluation
    contenu: "Mains visuellement propres, ongles sans dépôts sombres, plus de traces de savon, mains et avant-bras secs."
  - type: attention
    items:
      - "Ne pas toucher le robinet après rinçage : le fermer avec le dernier essuie-mains."
      - "Séchage par tamponnement, avec des essuie-mains à usage unique."
qcm:
  - id: q1
    enonce: "Quelle est la durée du savonnage lors du lavage des mains ?"
    propositions:
      - "10 secondes"
      - "30 secondes"
      - "1 minute"
      - "5 minutes"
    bonnes:
      - 1
    explication: "On savonne pendant 30 secondes en insistant sur les zones à risque (pulpe des doigts, espaces interdigitaux, ongles…)."
  - id: q2
    enonce: "Dans quels cas le lavage des mains est-il indiqué ?"
    propositions:
      - "Au retrait des gants"
      - "Entre deux victimes"
      - "Uniquement en fin de mission"
      - "Chaque fois que les mains sont visiblement souillées"
    bonnes:
      - 0
      - 1
      - 3
    explication: "Le lavage est indiqué notamment au retrait des gants, entre deux victimes, avant un soin et quand les mains sont souillées, pas seulement en fin de mission."
  - id: q3
    enonce: "Comment ferme-t-on le robinet après le rinçage ?"
    propositions:
      - "Avec la main nue"
      - "Avec le dernier essuie-mains utilisé"
      - "Avec le coude uniquement"
    bonnes:
      - 1
    explication: "Le dernier essuie-mains sert à fermer le robinet, puis il est jeté sans toucher la poubelle avec les mains."
  - id: q4
    enonce: "Comment sèche-t-on les mains ?"
    propositions:
      - "Par frottement avec un torchon"
      - "Par tamponnement avec des essuie-mains à usage unique"
      - "À l'air libre sans essuyer"
    bonnes:
      - 1
    explication: "Le séchage se fait par tamponnement avec des essuie-mains à usage unique."
  - id: q5
    enonce: "Quel savon utiliser ?"
    propositions:
      - "Savon neutre liquide"
      - "Savon en pain partagé"
      - "Gel hydroalcoolique"
    bonnes:
      - 0
    explication: "Le matériel comprend du savon neutre liquide, avec eau du robinet (à défaut en bouteille)."
