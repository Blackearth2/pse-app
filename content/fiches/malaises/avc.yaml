# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: avc
niveau: PSE1
chapitre: malaises
type: procedure
ordre: 1
titre: Accident vasculaire cérébral
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
blocs:
  - type: texte
    titre: En bref
    contenu: "L'AVC est une urgence absolue : le délai entre le début des signes et la prise en charge spécialisée conditionne les séquelles. L'heure de début est l'information clé."
  - type: chiffres
    titre: À retenir
    items:
      - valeur: Capitale
        libelle: Heure des premiers signes
      - valeur: Strictement à plat
        libelle: Position
      - valeur: Non
        libelle: Oxygène systématique
      - valeur: "15"
        libelle: Alerte
  - type: etapes
    titre: Conduite à tenir
    items:
      - "Rechercher les signes : visage paralysé, faiblesse ou inertie d'un membre, trouble de la parole, apparus brutalement."
      - Noter l'heure de début des signes (ou l'heure où la victime a été vue normale pour la dernière fois).
      - Allonger la victime strictement à plat si elle est consciente ; PLS si elle perd connaissance.
      - Réaliser le bilan (dont glycémie si autorisé), transmettre rapidement au médecin régulateur.
      - Surveiller, ne rien donner à boire ni à manger.
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - L'oxygène n'est plus systématique en cas d'AVC.
      - La position est strictement à plat.
qcm:
  - id: q1
    enonce: Victime consciente, suspicion d'AVC. Position (RTN 2026) ?
    propositions:
      - Demi-assise
      - Strictement à plat
      - Jambes surélevées
      - Debout accompagnée
    bonnes:
      - 1
    explication: Les RTN 2026 précisent une position strictement à plat.
    nouveaute: true
  - id: q2
    enonce: "En cas d'AVC, l'oxygène est :"
    propositions:
      - Systématique à haut débit
      - Plus systématique
      - Interdit
      - Donné uniquement à 1 L/min
    bonnes:
      - 1
    explication: L'oxygénothérapie systématique est supprimée pour l'AVC.
    nouveaute: true
  - id: q3
    enonce: "Information essentielle à transmettre pour un AVC :"
    propositions:
      - L'heure de début des signes
      - Le dernier repas
      - Le groupe sanguin
      - La taille
    bonnes:
      - 0
    explication: L'heure de début conditionne l'accès aux traitements spécialisés.
