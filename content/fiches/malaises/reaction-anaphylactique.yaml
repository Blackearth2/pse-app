# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: reaction-anaphylactique
niveau: PSE1
chapitre: malaises
type: procedure
ordre: 2
titre: Réaction anaphylactique
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
blocs:
  - type: texte
    titre: En bref
    contenu: Réaction allergique grave et rapide (piqûre, aliment, médicament) avec atteinte respiratoire, circulatoire et/ou cutanée. L'adrénaline est le traitement de première intention.
  - type: chiffres
    titre: À retenir
    items:
      - valeur: Face antéro-latérale de la cuisse
        libelle: Auto-injecteur
      - valeur: Après 5 min
        libelle: 2e injection
      - valeur: Position assise
        libelle: Détresse respiratoire
      - valeur: Allongée
        libelle: Détresse circulatoire
  - type: etapes
    titre: Conduite à tenir
    items:
      - "Reconnaître la réaction : gonflement, gêne respiratoire, malaise, éruption, après exposition à un allergène."
      - Aider la victime à utiliser son auto-injecteur d'adrénaline (ou l'administrer si le secouriste y est autorisé).
      - "Installer en position adaptée : assise si gêne respiratoire, allongée si malaise ou signes circulatoires."
      - Alerter le 15, administrer l'oxygène si nécessaire, surveiller.
      - En l'absence d'amélioration, deuxième injection 5 minutes après la première.
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - La deuxième injection d'adrénaline intervient à 5 minutes (contre 10 à 15 minutes auparavant).
qcm:
  - id: q1
    enonce: "Pas d'amélioration après une première injection d'adrénaline. 2e injection après :"
    propositions:
      - 2 minutes
      - 5 minutes
      - 10 à 15 minutes
      - 30 minutes
    bonnes:
      - 1
    explication: "RTN 2026 : la seconde injection intervient à 5 minutes (10 à 15 min auparavant)."
    nouveaute: true
  - id: q2
    enonce: "Site d'injection de l'auto-injecteur d'adrénaline :"
    propositions:
      - Face antéro-latérale de la cuisse
      - Deltoïde
      - Fesse
      - Abdomen
    bonnes:
      - 0
    explication: Face antéro-latérale de la cuisse, éventuellement à travers le vêtement.
