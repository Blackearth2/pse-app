id: douleur-thoracique-conduite-a-tenir
niveau: PSE2
chapitre: malaises
type: procedure
ordre: 7
titre: Douleur thoracique non traumatique (conduite à tenir)
motsCles: [douleur thoracique, conduite à tenir, malaise, électrocardiogramme, détresse vitale]
statut: brouillon
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 06PR02, 07-2026)
  code: 06PR02
  page: 186
liees: [douleur-thoracique-connaissances, malaise-aggravation-maladie-conduite-a-tenir, realisation-electrocardiogramme, detresse-circulatoire-conduite-a-tenir]
blocs:
  - type: texte
    titre: En bref
    contenu: "La conduite à tenir devant une douleur thoracique sans signe évident de détresse repose sur celle du malaise, adaptée par la réalisation d'un électrocardiogramme."
  - type: etapes
    titre: Face à une urgence ou une détresse vitale, ou en cas d'aggravation
    items:
      - "Appliquer la conduite à tenir adaptée et réaliser en priorité les gestes d'urgence qui s'imposent."
  - type: etapes
    titre: Face à une douleur thoracique sans signe évident de détresse
    items:
      - "Appliquer la conduite à tenir devant une victime qui présente un malaise."
      - "Adapter la conduite à tenir : réaliser un électrocardiogramme."
qcm:
  - id: q1
    enonce: "Que fait-on en priorité face à une douleur thoracique associée à une détresse vitale ?"
    propositions:
      - "Appliquer la conduite à tenir adaptée et réaliser en priorité les gestes d'urgence qui s'imposent"
      - "Réaliser d'abord un électrocardiogramme"
      - "Attendre l'évolution des signes"
    bonnes:
      - 0
    explication: "Face à une urgence ou une détresse vitale, on applique la conduite adaptée et on réalise en priorité les gestes d'urgence."
  - id: q2
    enonce: "Face à une douleur thoracique sans signe évident de détresse, sur quelle conduite à tenir s'appuie-t-on ?"
    propositions:
      - "Celle de la victime qui présente un malaise"
      - "Celle de la victime inconsciente"
      - "Celle de l'hémorragie externe"
    bonnes:
      - 0
    explication: "On applique la conduite à tenir devant une victime qui présente un malaise, puis on l'adapte."
  - id: q3
    enonce: "Quelle adaptation est prévue pour une douleur thoracique sans signe évident de détresse ?"
    propositions:
      - "Réaliser un électrocardiogramme"
      - "Mesurer la glycémie capillaire"
      - "Réaliser des manœuvres physiques"
    bonnes:
      - 0
    explication: "L'adaptation prévue est la réalisation d'un électrocardiogramme."
  - id: q4
    enonce: "Quels éléments s'appliquent à une victime consciente qui présente une douleur thoracique sans signe évident de détresse ?"
    propositions:
      - "La conduite à tenir du malaise"
      - "La réalisation d'un électrocardiogramme"
      - "Une mise en position strictement assise dans tous les cas"
    bonnes:
      - 0
      - 1
    explication: "La conduite du malaise est appliquée et adaptée par un électrocardiogramme. Aucune position unique imposée n'est indiquée dans cette fiche."
