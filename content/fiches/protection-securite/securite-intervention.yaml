id: securite-intervention
niveau: PSE1
chapitre: protection-securite
type: procedure
ordre: 2
titre: Sécurité sur intervention
motsCles: [sécurité, dangers, zone d'intervention, protection collective, suraccident, dégagement d'urgence]
statut: brouillon
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 02PR01, 06-2018)
  code: 02PR01
  page: 37
liees:
  - degagement-urgence
  - securite-intervention-particuliere
blocs:
  - type: texte
    titre: En bref
    contenu: "Dès le premier regard, le secouriste reconnaît les dangers, puis délimite la zone, met en place les protections collectives et supprime les dangers pour protéger intervenants, victime et tiers, notamment contre le suraccident."
  - type: etapes
    titre: Reconnaître les dangers (1er regard)
    items:
      - "Approcher prudemment de la zone de l'accident pour évaluer les dangers potentiels pour les intervenants et les témoins."
      - "Repérer les personnes qui pourraient être exposées aux dangers identifiés et le nombre de victimes ; se renseigner si besoin auprès des témoins."
      - "Regarder autour de la victime, en restant à distance d'elle, pour évaluer la présence de dangers persistants qui peuvent la menacer."
  - type: etapes
    titre: Assurer la protection
    items:
      - "Délimiter clairement, largement et visiblement la zone d'intervention ou de danger et empêcher toute intrusion dans cette zone."
      - "Mettre en place les moyens de protection collective en dotation."
      - "Supprimer immédiatement et, si possible, de façon permanente les dangers environnants pour protéger les intervenants, la victime et les autres personnes, notamment du suraccident."
      - "En cas d'impossibilité ou de danger réel et imminent pour la victime : réaliser un dégagement d'urgence."
  - type: texte
    titre: À noter
    contenu: "Selon les moyens humains disponibles, toutes ces actions peuvent se faire simultanément. Les intervenants utilisent tous les moyens matériels disponibles et s'assurent si besoin du concours de toute autre personne pouvant aider à la protection."
  - type: attention
    items:
      - "Regarder autour de la victime en restant à distance d'elle."
      - "Le dégagement d'urgence est réservé aux cas où supprimer le danger est impossible, ou en cas de danger réel et imminent pour la victime."
qcm:
  - id: q1
    enonce: "Lors du premier regard, comment le secouriste évalue-t-il les dangers persistants autour de la victime ?"
    propositions:
      - "En se plaçant immédiatement à côté d'elle"
      - "En regardant autour d'elle, en restant à distance"
      - "En la déplaçant systématiquement"
    bonnes:
      - 1
    explication: "Il faut regarder autour de la victime en restant à distance d'elle pour évaluer la présence de dangers persistants."
  - id: q2
    enonce: "Quand réaliser un dégagement d'urgence dans le cadre de la protection ?"
    propositions:
      - "Systématiquement, dès l'arrivée"
      - "Seulement si la victime est consciente"
      - "Lorsqu'on ne peut pas supprimer le danger ou en cas de danger réel et imminent pour la victime"
      - "Jamais avant l'arrivée des sapeurs-pompiers"
    bonnes:
      - 2
    explication: "En cas d'impossibilité de supprimer le danger ou de danger réel et imminent pour la victime, on réalise un dégagement d'urgence."
  - id: q3
    enonce: "Quelles actions font partie de la protection sur intervention ?"
    propositions:
      - "Délimiter clairement, largement et visiblement la zone"
      - "Mettre en place les moyens de protection collective en dotation"
      - "Laisser les témoins s'approcher pour aider"
      - "Supprimer immédiatement les dangers environnants, si possible de façon permanente"
    bonnes:
      - 0
      - 1
      - 3
    explication: "Il faut empêcher toute intrusion dans la zone délimitée, mettre en place les protections collectives et supprimer les dangers ; laisser les témoins s'approcher est contraire à la délimitation de la zone."
  - id: q4
    enonce: "Quel est l'objectif de la suppression des dangers environnants ?"
    propositions:
      - "Accélérer le transport de la victime"
      - "Éviter de réaliser le bilan"
      - "Protéger les intervenants, la victime et les autres personnes, notamment du suraccident"
    bonnes:
      - 2
    explication: "La suppression des dangers protège intervenants, victime et tiers, notamment contre le suraccident."
