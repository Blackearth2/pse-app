id: le-citoyen-securite-civile
niveau: PSE1
chapitre: attitude-comportement
type: connaissance
ordre: 1
titre: Le citoyen de Sécurité Civile
motsCles: [citoyen, sécurité civile, L721-1, collaborateur occasionnel, prévention, ambassadeur, GQS, PSC]
statut: brouillon
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 01AC01, 07-2026)
  code: 01AC01
  page: 10
liees: [enjeux-principes, attitude-comportement-secouriste]
blocs:
  - type: texte
    titre: En bref
    contenu: "Cette fiche ne fait pas l'objet d'un enseignement spécifique : ses messages sont distillés tout au long de la formation, au moment le plus opportun. Le citoyen est un acteur majeur de la Sécurité Civile ; toute formation aux premiers secours est l'occasion de rappeler sa place essentielle."
  - type: chiffres
    titre: Repères
    items:
      - valeur: Article L721-1
        libelle: "Code de la Sécurité Intérieure : toute personne concourt par son comportement à la sécurité civile (loi de 2004 de modernisation de la sécurité civile)"
      - valeur: Loi n° 2020-840 du 3 juillet 2020
        libelle: "Le bénévole qui porte assistance à une personne en péril grave et imminent est un citoyen sauveteur et un collaborateur occasionnel du service public"
      - valeur: Moins de 15 ans et personnes âgées
        libelle: Publics particulièrement touchés par les accidents de la vie courante
  - type: liste
    titre: Messages clés
    items:
      - "Le premier maillon : le secouriste est la première personne formée à la prise en charge de victimes (accident, malaise, aggravation brutale d'une maladie, etc.)."
      - "Prévenir les accidents de la vie courante ou l'aggravation de situations : supprimer ou réduire un danger, respecter les consignes de sécurité (autorités, collectivités, encadrants de loisirs, notices techniques), ce qui réduit aussi la sollicitation des secours et du système de santé."
      - "Anticiper certaines aggravations en allant au-devant des personnes (personne qui semble mal, personnes fragiles ou âgées en période de grand froid ou de fortes chaleurs, parent ou voisin sans nouvelles) et par une attitude empathique qui réduit l'impact psychologique."
      - "Entretenir et développer ses compétences : actualisation régulière recommandée même sans obligation de formation continue ; après une sensibilisation aux gestes qui sauvent (GQS), se former au premier secours citoyen (PSC) ou à un niveau supérieur."
      - "S'engager : pompier volontaire, bénévole de Sécurité Civile, réserviste, volontaire du Service civique ; gestes simples comme donner son sang, avoir de bonnes pratiques numériques face à l'urgence, installer une application citoyenne d'alerte en cas d'arrêt cardiaque à proximité."
      - "Être un ambassadeur des messages de sécurité civile : partager son expérience et inciter à se former, relayer les communications de sécurité civile, partager ses compétences lors de crises auprès des associations agréées de sécurité civile."
  - type: liste
    titre: Réduire l'impact psychologique pour le citoyen
    items:
      - "Sa préparation : se former régulièrement pour intervenir avec une moindre gêne des effets du stress."
      - "Sa posture auprès de la victime : se mettre à sa hauteur, l'écouter, la rassurer, l'accompagner du regard, respecter son intimité."
      - "L'échange avec les secours présents, une fois la victime prise en charge."
qcm:
  - id: q1
    enonce: "Quel article du Code de la Sécurité Intérieure affirme que toute personne concourt par son comportement à la sécurité civile ?"
    propositions:
      - L721-1
      - L1110-4
      - "226-13"
    bonnes: [0]
    explication: "Le référentiel cite l'article L721-1 du Code de la Sécurité Intérieure. L1110-4 et 226-13 concernent le secret professionnel (fiche 01AC03)."
  - id: q2
    enonce: "Selon la loi n° 2020-840 du 3 juillet 2020, quelle qualité bénéficie à celui qui porte assistance de manière bénévole à une personne en péril grave et imminent ?"
    propositions:
      - "Citoyen sauveteur, collaborateur occasionnel du service public"
      - "Agent de la Sécurité Civile"
      - "Secouriste de fait dispensé de toute formation"
      - "Réserviste de Sécurité Civile"
    bonnes: [0]
    explication: "Le bénévole en situation de péril grave et imminent est un citoyen sauveteur et bénéficie de la qualité de collaborateur occasionnel du service public."
  - id: q3
    enonce: "Quels publics sont particulièrement touchés par les accidents de la vie courante ?"
    propositions:
      - "Les adultes actifs de 30 à 50 ans"
      - "Les enfants de moins de 15 ans et les personnes âgées"
      - "Les sportifs de haut niveau"
      - "Les nourrissons uniquement"
    bonnes: [1]
    explication: "Les services de secours sont souvent sollicités pour des accidents de la vie courante qui touchent particulièrement les enfants de moins de 15 ans et les personnes âgées."
  - id: q4
    enonce: "Que recommande le référentiel à une personne ayant suivi une sensibilisation aux gestes qui sauvent (GQS) ?"
    propositions:
      - "Rien de plus, la sensibilisation suffit"
      - "Se former au premier secours citoyen (PSC) ou à un niveau supérieur"
      - "Attendre une obligation de formation continue"
    bonnes: [1]
    explication: "La personne est invitée à développer ses compétences par une formation PSC, formation de base du citoyen, ou d'un niveau supérieur."
  - id: q5
    enonce: "Parmi ces éléments, lesquels contribuent à réduire l'impact psychologique pour le citoyen qui intervient ?"
    propositions:
      - Se former régulièrement
      - "Se mettre à la hauteur de la victime, l'écouter et la rassurer"
      - "Éviter tout échange avec les secours une fois la victime prise en charge"
      - "Respecter l'intimité de la victime"
    bonnes: [0, 1, 3]
    explication: "La préparation, la posture (hauteur, écoute, réassurance, respect de l'intimité) et l'échange avec les secours présents réduisent l'impact psychologique. Cet échange est à favoriser, pas à éviter."
