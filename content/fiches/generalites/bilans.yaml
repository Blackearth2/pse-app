# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: bilans
niveau: PSE1
chapitre: generalites
type: procedure
ordre: 2
titre: Les bilans et la transmission
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
blocs:
  - type: texte
    titre: En bref
    contenu: "Le bilan est une démarche structurée : bilan circonstanciel, bilan d'urgence vitale, bilan complémentaire, surveillance, puis transmission au médecin régulateur."
  - type: chiffres
    titre: À retenir
    items:
      - valeur: 12–20 /min
        libelle: FR adulte au repos
      - valeur: 60–100 /min
        libelle: FC adulte au repos
      - valeur: ≥ 94 %
        libelle: SpO2 normale
      - valeur: "15"
        libelle: SAMU
  - type: etapes
    titre: Conduite à tenir
    items:
      - "Bilan circonstanciel : nature de l'événement, dangers, nombre de victimes, moyens nécessaires."
      - "Bilan d'urgence vitale : rechercher une hémorragie, apprécier la conscience, la ventilation et la circulation ; agir immédiatement face à une détresse."
      - "Bilan complémentaire : plainte, questionnement, examen de la tête aux pieds, mesures des paramètres."
      - Surveillance régulière de l'évolution et des paramètres.
      - Transmission structurée au médecin régulateur, puis application des consignes.
  - type: nouveaute
    titre: Ce qui change en 2026
    items:
      - "Une note précise que la fiabilité de la SpO2 peut être altérée sur une peau pigmentée : le saturomètre peut surestimer la saturation, à interpréter avec la clinique."
      - La numérotation des fiches du référentiel est réorganisée.
qcm:
  - id: q1
    enonce: "Sur une peau fortement pigmentée, la SpO2 affichée par l'oxymètre :"
    propositions:
      - Est toujours parfaitement fiable
      - Peut surestimer la saturation réelle
      - Est toujours sous-estimée de 10 %
      - Ne peut pas être mesurée
    bonnes:
      - 1
    explication: "Les RTN 2026 ajoutent une note sur la fiabilité de la SpO2 selon la pigmentation cutanée : la valeur doit être confrontée à la clinique."
    nouveaute: true
  - id: q2
    enonce: "Fréquence respiratoire normale d'un adulte au repos :"
    propositions:
      - 6 à 10 /min
      - 12 à 20 /min
      - 25 à 35 /min
      - 40 à 60 /min
    bonnes:
      - 1
    explication: Entre 12 et 20 mouvements par minute chez l'adulte au repos.
  - id: q3
    enonce: Dans quel ordre s'enchaînent les bilans ?
    propositions:
      - Complémentaire, circonstanciel, urgence vitale
      - Circonstanciel, urgence vitale, complémentaire
      - Urgence vitale, circonstanciel, complémentaire
      - Surveillance, circonstanciel, complémentaire
    bonnes:
      - 1
    explication: Circonstanciel (la scène) → urgence vitale (détresses) → complémentaire → surveillance et transmission.
  - id: q4
    enonce: Quels éléments font partie du bilan d’urgence vitale ?
    propositions:
      - Rechercher une hémorragie
      - Apprécier la conscience
      - Interroger sur les antécédents
      - Apprécier la ventilation
    bonnes:
      - 0
      - 1
      - 3
    explication: Le bilan d’urgence vitale recherche une hémorragie et apprécie conscience, ventilation et circulation ; les antécédents relèvent du bilan complémentaire.
