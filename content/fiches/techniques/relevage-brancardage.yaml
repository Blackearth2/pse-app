# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: relevage-brancardage
niveau: PSE2
chapitre: techniques
type: technique
ordre: 1
titre: Relevage et brancardage
statut: brouillon
source:
  document: Recommandations PSE — édition 2026 (à confirmer)
  code: À vérifier
liees:
  - traumatisme-rachis
blocs:
  - type: texte
    titre: En bref
    contenu: Relever et transporter une victime sans aggraver son état demande une technique maîtrisée et une coordination stricte de l'équipe.
  - type: chiffres
    titre: À retenir
    items:
      - valeur: Chef d'équipe
        libelle: Qui commande
      - valeur: Tête-cou-tronc
        libelle: Axe
      - valeur: Annoncés puis exécutés
        libelle: Ordres
      - valeur: Dos droit, jambes
        libelle: Sécurité
  - type: etapes
    titre: Conduite à tenir
    items:
      - Choisir la technique adaptée à l'état de la victime et au lieu (pont, cuillère, matelas).
      - Répartir les rôles ; l'équipier qui commande est clairement identifié.
      - Annoncer chaque manœuvre (préparation, puis exécution sur commande).
      - Maintenir l'axe tête-cou-tronc pendant tout déplacement si traumatisme.
      - "Protéger son dos : charge près du corps, dos droit, force dans les jambes."
qcm:
  - id: q1
    enonce: Pendant un relevage, qui donne les ordres ?
    propositions:
      - Chaque équipier
      - L'équipier désigné pour commander
      - La victime
      - Le témoin le plus proche
    bonnes:
      - 1
    explication: "Un seul commandement, identifié et annoncé : préparation, puis exécution."
