id: amputation-arrachement-connaissances
niveau: PSE1
chapitre: traumatismes
type: connaissance
ordre: 8
titre: Amputation ou arrachement complet d'une partie du corps (connaissances)
motsCles: [amputation, arrachement, hémorragie externe, réimplantation, temps d'ischémie, amputation partielle]
statut: brouillon
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 07AC03, 07-2026)
  code: 07AC03
  page: 214
liees: []
blocs:
  - type: liste
    titre: Définition
    items:
      - "Amputation ou arrachement complet : une partie externe du corps (doigt, main, bras, etc.) ou des tissus mous (joue, nez, oreille, organes génitaux, etc.) est entièrement séparée du corps, sans aucune liaison résiduelle (muscles, tendons, peau)."
      - "Amputation ou arrachement partiel : des connexions résiduelles (muscles, vaisseaux sanguins, peau) sont conservées, ce qui augmente les possibilités de réparation chirurgicale et de récupération fonctionnelle."
  - type: texte
    titre: Causes
    contenu: "Ils touchent surtout les jeunes enfants et les adultes, sont toujours d'origine traumatique et surviennent le plus souvent après un accident domestique ou un accident du travail."
  - type: liste
    titre: Risques et conséquences
    items:
      - "Séquelles physiques et psychologiques majeures possibles."
      - "Premier risque : l'hémorragie externe, dont la survenue peut être retardée de plusieurs minutes. Son contrôle reste la priorité des premiers secours."
      - "Une réimplantation chirurgicale est parfois possible ; elle dépend étroitement de la qualité de la prise en charge initiale de la partie sectionnée."
      - "Le temps d'ischémie (arrêt ou insuffisance de la circulation du sang dans un tissu, un membre ou un organe) est un facteur décisif de réussite ; une conservation correcte par refroidissement augmente significativement les chances."
  - type: liste
    titre: Principe de l'action de secours
    items:
      - "Arrêter le saignement."
      - "Lutter contre la détresse circulatoire."
      - "Retrouver et préserver la partie du corps amputée ou arrachée."
      - "Transporter avec la victime la partie du corps amputée ou arrachée."
qcm:
  - id: q1
    enonce: "Quelle différence entre amputation complète et partielle ?"
    propositions:
      - "Complète : aucune liaison résiduelle ; partielle : des connexions résiduelles (muscles, vaisseaux, peau) subsistent"
      - "Complète : la peau seule est atteinte ; partielle : l'os est atteint"
      - "Il n'y a aucune différence"
    bonnes: [0]
    explication: "Dans l'amputation complète, la partie est entièrement séparée sans liaison résiduelle ; dans la partielle, des connexions subsistent, ce qui améliore les possibilités de réparation."
  - id: q2
    enonce: "Quel est le premier risque d'une amputation ?"
    propositions:
      - "L'infection tardive"
      - "L'hémorragie externe, dont la survenue peut être retardée de plusieurs minutes"
      - "Les séquelles esthétiques"
    bonnes: [1]
    explication: "Le premier risque est l'hémorragie externe, parfois retardée de plusieurs minutes ; son contrôle est la priorité."
  - id: q3
    enonce: "De quoi dépend la réussite d'une réimplantation ?"
    propositions:
      - "De la qualité de la prise en charge initiale de la partie sectionnée"
      - "Du temps d'ischémie"
      - "D'une conservation correcte par refroidissement"
      - "Uniquement de l'âge de la victime"
    bonnes: [0, 1, 2]
    explication: "La réimplantation dépend étroitement de la prise en charge initiale ; le temps d'ischémie est un facteur décisif et le refroidissement augmente les chances."
  - id: q4
    enonce: "Quels éléments sont des tissus mous pouvant faire l'objet d'un arrachement complet ?"
    propositions:
      - "La joue, le nez, l'oreille"
      - "Le fémur"
      - "Le foie"
    bonnes: [0]
    explication: "Le référentiel cite parmi les tissus mous la joue, le nez, l'oreille et les organes génitaux."
  - id: q5
    enonce: "Quelles actions relèvent du principe de l'action de secours ?"
    propositions:
      - "Arrêter le saignement et lutter contre la détresse circulatoire"
      - "Retrouver et préserver la partie amputée"
      - "Jeter la partie amputée si elle est souillée"
      - "Transporter la partie amputée avec la victime"
    bonnes: [0, 1, 3]
    explication: "On arrête le saignement, on lutte contre la détresse circulatoire, on retrouve et préserve la partie amputée et on la transporte avec la victime."
