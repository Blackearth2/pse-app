id: traumatisme-bassin-conduite-a-tenir
niveau: PSE2
chapitre: traumatismes
type: procedure
ordre: 35
titre: Traumatisme du bassin (conduite à tenir)
motsCles: [bassin, position allongée stricte, dénuder, contention externe, avis médical, matelas à dépression, surveillance]
statut: brouillon
source:
  document: Référentiels techniques nationaux PSE — juillet 2026 (fiche 07PR10, 07-2026)
  code: 07PR10
  page: 264
liees: [traumatisme-bassin-connaissances, contention-pelvienne, immobilisation-matelas-depression, detresse-circulatoire-conduite-a-tenir]
blocs:
  - type: texte
    titre: En bref
    contenu: "En cas d'urgence ou de détresse vitale, ou en cas d'aggravation, appliquer la conduite à tenir adaptée et réaliser en priorité les gestes d'urgence qui s'imposent. Face à un traumatisme du bassin, la victime est laissée allongée, le bassin est examiné, et une contention externe est mise en place dans les conditions précisées ci-dessous."
  - type: etapes
    titre: Conduite à tenir face à un traumatisme du bassin
    items:
      - "Laisser la victime en position allongée stricte, si possible."
      - "Dénuder le bassin de la victime, dans la mesure du possible en préservant son intimité, pour vérifier la présence de lésions (plaies, hématomes, œdèmes) ou de sang sur les sous-vêtements ; le bas du dos et les fesses sont aussi vérifiés au cours de la mobilisation (PLS, relevage, immobilisation)."
      - "Mettre en place une contention externe du bassin si la victime présente un traumatisme du bassin associé à des signes de détresse circulatoire : après avis médical, ou en cas d'impossibilité d'obtenir un avis médical."
      - "Protéger au plus vite contre le froid, le vent ou la chaleur."
      - "Transmettre le bilan pour obtenir un avis médical."
      - "Relever et immobiliser sur un matelas à dépression, selon les consignes reçues."
      - "Surveiller attentivement la victime, du fait d'un risque d'aggravation brutale."
  - type: attention
    titre: Points de vigilance
    items:
      - "La contention externe du bassin n'est indiquée que si un traumatisme du bassin s'accompagne de signes de détresse circulatoire."
      - "Elle est posée après avis médical, ou lorsqu'un avis médical ne peut pas être obtenu."
      - "Préserver l'intimité de la victime lors du déshabillage du bassin."
      - "Risque d'aggravation brutale : surveillance attentive."
qcm:
  - id: q1
    enonce: "Dans quelle position laisse-t-on, si possible, une victime de traumatisme du bassin ?"
    propositions:
      - "Position assise"
      - "Position demi-assise"
      - "Position allongée stricte"
    bonnes:
      - 2
    explication: "La victime est laissée, si possible, en position allongée stricte."
  - id: q2
    enonce: "Pourquoi dénude-t-on le bassin de la victime ?"
    propositions:
      - "Pour lui permettre de se rafraîchir"
      - "Pour vérifier la présence de lésions (plaies, hématomes, œdèmes) ou de sang sur les sous-vêtements"
      - "Pour la peser"
    bonnes:
      - 1
    explication: "Le bassin est dénudé, en préservant si possible l'intimité, pour rechercher plaies, hématomes, œdèmes ou sang sur les sous-vêtements."
  - id: q3
    enonce: "Dans quels cas met-on en place une contention externe du bassin ?"
    propositions:
      - "Toute douleur isolée du bras"
      - "Traumatisme du bassin avec signes de détresse circulatoire, après avis médical"
      - "Traumatisme du bassin sans aucun signe de détresse circulatoire, systématiquement"
      - "Traumatisme du bassin avec signes de détresse circulatoire, si un avis médical est impossible à obtenir"
    bonnes:
      - 1
      - 3
    explication: "La contention est mise en place en cas de traumatisme du bassin associé à des signes de détresse circulatoire, après avis médical ou en cas d'impossibilité d'obtenir cet avis."
  - id: q4
    enonce: "Sur quel matériel relève-t-on et immobilise-t-on la victime, selon les consignes reçues ?"
    propositions:
      - "Une chaise de transport"
      - "Un simple drap"
      - "Une attelle cervico-thoracique uniquement"
      - "Un matelas à dépression"
    bonnes:
      - 3
    explication: "La victime est relevée et immobilisée sur un matelas à dépression, selon les consignes reçues."
  - id: q5
    enonce: "Que doit-on faire en plus lors de la prise en charge d'une victime de traumatisme du bassin ?"
    propositions:
      - "La faire marcher pour tester la douleur"
      - "La protéger contre le froid, le vent ou la chaleur"
      - "Transmettre le bilan pour obtenir un avis médical"
      - "La surveiller attentivement du fait du risque d'aggravation brutale"
    bonnes:
      - 1
      - 2
      - 3
    explication: "La protection thermique, la transmission du bilan pour avis médical et la surveillance attentive font partie de la conduite à tenir."
