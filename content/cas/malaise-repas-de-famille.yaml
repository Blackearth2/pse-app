# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: malaise-repas-de-famille
niveau: PSE1
titre: Malaise au repas de famille
lieu: Domicile, femme de 68 ans
statut: brouillon
liees:
  - avc
contexte: Pendant le déjeuner, une femme laisse tomber son verre. Son fils remarque que sa bouche est déviée.
etapes:
  - moment: À l'arrivée
    situation: Bouche déviée, bras droit qui retombe, parole confuse, apparus il y a 10 minutes.
    question: Ton hypothèse ?
    type: choix
    propositions:
      - texte: "Suspicion d'AVC : alerte rapide"
        correct: true
        retour: Oui.
      - texte: Hypoglycémie certaine, on la fait manger
        correct: false
        retour: "On ne donne rien : risque de fausse route."
      - texte: Fatigue, on la laisse se reposer
        correct: false
        retour: Non.
  - moment: Installation
    situation: Elle est consciente.
    question: Comment l'installer ?
    type: choix
    propositions:
      - texte: Strictement à plat
        correct: true
        retour: "Oui : précision des RTN 2026."
      - texte: Demi-assise
        correct: false
        retour: Non retenu en 2026 pour l'AVC.
      - texte: Debout pour tester l'équilibre
        correct: false
        retour: Dangereux.
  - moment: Soins
    situation: Sa SpO2 est à 97 %.
    question: Oxygène ?
    type: choix
    propositions:
      - texte: Pas d'oxygène systématique
        correct: true
        retour: "Oui : il est supprimé en 2026."
      - texte: Oxygène à haut débit systématique
        correct: false
        retour: Ancienne pratique.
      - texte: Uniquement si elle le demande
        correct: false
        retour: Non.
  - moment: Transmission
    situation: Le médecin régulateur prend ton bilan.
    question: L'élément indispensable ?
    type: choix
    propositions:
      - texte: L'heure de début des signes
        correct: true
        retour: "Oui : elle conditionne le traitement."
      - texte: Son plat préféré
        correct: false
        retour: Non.
      - texte: Son poids exact
        correct: false
        retour: Secondaire.
pointsCles:
  - "Signes brutaux : visage, membre, parole."
  - "Heure de début : information clé."
  - Position strictement à plat, O2 non systématique (RTN 2026).
  - Alerte rapide du 15.
