# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: arret-cardiaque-salle-de-sport
niveau: PSE1
titre: Arrêt cardiaque en salle de sport
lieu: Club de sport, équipe de 3
statut: brouillon
liees:
  - arret-cardiaque-adulte
contexte: Un homme de 50 ans s'effondre pendant une séance. Ton équipe dispose d'un sac de premiers secours, d'un BAVU, d'oxygène et d'un DAE.
etapes:
  - moment: À l'arrivée
    situation: La victime ne répond pas. Après libération des voies aériennes, tu observes des mouvements respiratoires rares et bruyants.
    question: Ton analyse ?
    type: choix
    propositions:
      - texte: "Arrêt cardiaque : compressions immédiates, DAE demandé"
        correct: true
        retour: "Oui : des gasps ne sont pas une respiration normale."
      - texte: "Il respire : PLS"
        correct: false
        retour: "Non : les gasps signent l'arrêt cardiaque."
      - texte: Rechercher le pouls pendant une minute
        correct: false
        retour: "Trop long : chaque seconde compte."
  - moment: +1 minute
    situation: Ton coéquipier revient avec le DAE.
    question: Comment l'organiser ?
    type: choix
    propositions:
      - texte: Il pose les électrodes pendant que tu poursuis les compressions
        correct: true
        retour: "Oui : en 2026, la RCP continue pendant la pose."
      - texte: Tu arrêtes la RCP le temps de la pose
        correct: false
        retour: "Non : on limite les interruptions."
      - texte: On attend la fin d'un cycle de 2 minutes
        correct: false
        retour: "Non : le DAE est mis en œuvre dès son arrivée."
  - moment: Analyse
    situation: "Le DAE annonce : « Choc recommandé »."
    question: Après le choc ?
    type: choix
    propositions:
      - texte: Reprendre immédiatement les compressions
        correct: true
        retour: "Oui : sans vérifier le pouls, on reprend la RCP."
      - texte: Vérifier le pouls avant tout
        correct: false
        retour: "Non : cela retarde la reprise des compressions."
      - texte: Mettre en PLS
        correct: false
        retour: "Non : la victime est toujours en arrêt."
  - moment: En continu
    situation: Le BAVU est relié à l'oxygène.
    question: Quel rythme ?
    type: choix
    propositions:
      - texte: 30 compressions / 2 insufflations
        correct: true
        retour: "Oui : ratio adulte."
      - texte: 15 compressions / 2 insufflations
        correct: false
        retour: C'est le ratio de l'enfant et du nourrisson.
      - texte: Compressions seules
        correct: false
        retour: Une équipe équipée ventile.
  - moment: Récapitulatif
    situation: Le relais est pris par l’équipe médicale. Tu refais le point sur l’intervention.
    question: Remets ces actions dans l’ordre.
    type: ordre
    elements:
      - "Constater l’arrêt : inconscience et absence de respiration normale"
      - Débuter les compressions thoraciques et faire apporter un DAE
      - Poser les électrodes pendant que la RCP continue
      - Reprendre les compressions immédiatement après le choc
    retour: Constat, compressions immédiates avec DAE demandé, pose des électrodes sans interrompre la RCP, reprise immédiate après le choc.
pointsCles:
  - Constater l'arrêt en 10 s au plus, compressions immédiates.
  - La RCP continue pendant la pose des électrodes (RTN 2026).
  - Reprendre les compressions immédiatement après le choc.
  - "30 : 2 chez l'adulte, 100–120/min, 5–6 cm."
