# Lot 0 — contenu repris du prototype. BROUILLON : à vérifier contre le texte officiel 2026.
id: piqure-au-marche
niveau: PSE1
titre: Piqûre au marché
lieu: Poste de secours, marché de plein air
statut: brouillon
liees:
  - reaction-anaphylactique
contexte: "Un homme d'une trentaine d'années se présente au poste : il vient d'être piqué par une guêpe. Il indique être allergique et porte sur lui un auto-injecteur."
etapes:
  - moment: À l'arrivée
    situation: Son visage gonfle, sa voix devient rauque, il respire en sifflant.
    question: Quelle est ta priorité ?
    type: choix
    propositions:
      - texte: L'aider à s'injecter l'adrénaline à la cuisse et faire alerter
        correct: true
        retour: "Oui : signes d'anaphylaxie, l'adrénaline est prioritaire, l'alerte est donnée en parallèle."
      - texte: Lui donner de l'eau et attendre
        correct: false
        retour: "Non : les signes respiratoires imposent l'adrénaline immédiatement."
      - texte: Appliquer du froid sur la piqûre
        correct: false
        retour: Utile en confort, mais secondaire face à une détresse.
  - moment: +1 minute
    situation: Il reste conscient mais respire difficilement.
    question: Comment l'installer ?
    type: choix
    propositions:
      - texte: Position assise ou demi-assise
        correct: true
        retour: "Oui : c'est la position qui facilite la respiration."
      - texte: À plat dos, jambes surélevées
        correct: false
        retour: Plutôt en cas de détresse circulatoire isolée ; ici la gêne est respiratoire.
      - texte: En PLS
        correct: false
        retour: "Il est conscient : la PLS n'est pas indiquée."
  - moment: +5 minutes
    situation: Aucune amélioration, sifflement persistant. Un deuxième auto-injecteur est disponible.
    question: Que fais-tu ?
    type: choix
    propositions:
      - texte: Deuxième injection, en lien avec le régulateur
        correct: true
        retour: "Oui : en 2026, la 2e injection intervient à 5 minutes."
      - texte: Attendre 15 minutes au total
        correct: false
        retour: "Ancien délai : il est ramené à 5 minutes."
      - texte: Ne rien faire de plus
        correct: false
        retour: "Non : absence d'amélioration = seconde dose."
  - moment: Transmission
    situation: Le médecin régulateur te demande ton bilan.
    question: Qu'est-ce qui est indispensable ?
    type: choix
    propositions:
      - texte: Les heures des injections et l'évolution des signes
        correct: true
        retour: "Oui : ces éléments orientent directement la suite de la prise en charge."
      - texte: Uniquement l'âge de la victime
        correct: false
        retour: Insuffisant.
      - texte: La marque de l'auto-injecteur uniquement
        correct: false
        retour: Secondaire.
pointsCles:
  - "Adrénaline sans délai : c'est le traitement de première intention."
  - "Position adaptée à la détresse : assise si gêne respiratoire."
  - 2e injection à 5 minutes si pas d'amélioration (RTN 2026).
  - Transmettre l'heure de chaque injection.
